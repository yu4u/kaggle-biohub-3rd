[project]
name = "biohub046"
version = "1.0.0"
description = "Reproduction of submission 046 v4 (Biohub - Cell Tracking During Development)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "albumentations>=2.0.8",
    "einops>=0.8.2",
    "joblib>=1.5.3",
    "lightgbm==4.7.0",
    "monai>=1.5.2",
    "numcodecs>=0.15.1",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "polars>=1.43",
    "pytorch-lightning>=2.6.5",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "timm>=1.0.28",
    "torch==2.7.1",
    "tracksdata",
    "xgboost==3.2.0",
    "zarr>=3.1.6",
]

[dependency-groups]
dev = ["pytest>=8"]

# torch wheels for CUDA 12.8 (Blackwell / sm_120 and every sm_75+ GPU); the CUDA runtime ships
# with the wheel, the container only needs the NVIDIA driver through the nvidia runtime
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
tracksdata = { git = "https://github.com/royerlab/tracksdata", rev = "7bfeaf845ceb951226f19b72fe5b80e01601018a" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biohub046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
